<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <h1>Formulario de Servicio Técnico</h1>

    <form action="#" method="post">
        <label for="nombre">Nombre del solicitante:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label>Tipo de servicio:</label><br>

        <input type="radio" id="instalacion" name="servicio" value="Instalacion" required>
        <label for="instalacion">Instalación</label><br>

        <input type="radio" id="mantenimiento" name="servicio" value="Mantenimiento" required>
        <label for="mantenimiento">Mantenimiento</label><br>

        <input type="radio" id="configuracion" name="servicio" value="Configuracion" required>
        <label for="configuracion">Configuración</label><br>

        <input type="radio" id="otros" name="servicio" value="Otros" required>
        <label for="otros">Otros</label><br><br>


        <label for="fecha">Fecha solicitada:</label>
        <input type="date" id="fecha" name="fecha" required><br><br>

        <label for="descripcion">Descripción del pedido:</label><br>
        <textarea name="nombre" rows="10" cols="50" required></textarea><br><br>

        <label>¿El servicio es urgente?</label>
        <input type="checkbox" id="urgencia_si" name="urgencia" value="Si">
        <label for="urgencia_si">Sí</label><br><br>

        <input type="submit" id="enviar" name="enviar" required>

   </form>


</body>
</html>
